name: Docker Companion

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-companion-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  GHCR_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/typr-server

jobs:
  source-checks:
    name: Typecheck, unit tests, and distribution metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Unraid template
        run: npm run test:unraid

      - name: Validate Compose definitions
        env:
          TYPR_COMPANION_WORKSPACE_DIR: /tmp/typr-companion-workspace-contract
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.dev.yaml config --quiet
          docker compose -f compose.yaml -f compose.workspace.yaml config --quiet

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

  test-image:
    name: Build and test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare build metadata
        id: build-metadata
        shell: bash
        run: |
          version="0.1.2-dev.${GITHUB_SHA::12}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "created=$(git show -s --format=%cI HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Build architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/typr-server.Dockerfile
          target: runtime
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: typr-server:ci-${{ matrix.arch }}
          build-args: |
            COMPANION_VERSION=${{ steps.build-metadata.outputs.version }}
            IMAGE_SOURCE=https://github.com/${{ github.repository }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.build-metadata.outputs.created }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.build-metadata.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.build-metadata.outputs.created }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          cache-from: type=gha,scope=typr-server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=typr-server-${{ matrix.arch }}

      - name: Test production Compose modes
        env:
          TYPR_COMPANION_IMAGE: typr-server:ci-${{ matrix.arch }}
        run: npm run test:compose

      - name: Test REST startup and compile behavior
        env:
          TYPR_COMPANION_DOCKER_IMAGE: typr-server:ci-${{ matrix.arch }}
          TYPR_COMPANION_DOCKER_SKIP_BUILD: "1"
          TYPR_COMPANION_EXPECTED_VERSION: ${{ steps.build-metadata.outputs.version }}
        run: npm run test:companion:docker

      - name: Test persistent TeXpresso executable
        env:
          TYPR_COMPANION_DOCKER_IMAGE: typr-server:ci-${{ matrix.arch }}
          TYPR_COMPANION_DOCKER_SKIP_BUILD: "1"
        run: npm run test:texpresso:poc

      - name: Test TeXpresso raster rendering
        env:
          TYPR_COMPANION_DOCKER_IMAGE: typr-server:ci-${{ matrix.arch }}
          TYPR_COMPANION_DOCKER_SKIP_BUILD: "1"
        run: npm run test:texpresso:render

      - name: Test WebSocket live-preview transport
        env:
          TYPR_COMPANION_DOCKER_IMAGE: typr-server:ci-${{ matrix.arch }}
          TYPR_COMPANION_DOCKER_SKIP_BUILD: "1"
        run: npm run test:texpresso:ws

  publish:
    name: Publish multi-platform image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [source-checks, test-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate release tag
        id: release
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Release tags must have the exact form vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"
          echo "created=$(git show -s --format=%cI HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            name=${{ env.GHCR_IMAGE_NAME }}
            name=${{ vars.DOCKERHUB_USERNAME || 'dockerhub-disabled' }}/typr-server,enable=${{ vars.DOCKERHUB_USERNAME != '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=typr-server
            org.opencontainers.image.description=Local Typr Companion native LaTeX runtime with experimental TeXpresso live preview
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/docs/companion-installation.md
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.release.outputs.created }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Build and publish manifest
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/typr-server.Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMPANION_VERSION=${{ steps.release.outputs.version }}
            IMAGE_SOURCE=https://github.com/${{ github.repository }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.release.outputs.created }}
          cache-from: |
            type=gha,scope=typr-server-amd64
            type=gha,scope=typr-server-arm64
          cache-to: type=gha,mode=max,scope=typr-server-release
          provenance: mode=max
          sbom: true

      - name: Inspect published manifest
        run: docker buildx imagetools inspect "${GHCR_IMAGE_NAME}:${{ steps.release.outputs.version }}"

      - name: Inspect Docker Hub manifest
        if: vars.DOCKERHUB_USERNAME != ''
        run: docker buildx imagetools inspect "${{ vars.DOCKERHUB_USERNAME }}/typr-server:${{ steps.release.outputs.version }}"

  verify-published:
    name: Verify published image (${{ matrix.platform }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published architecture
        run: docker pull --platform "${{ matrix.platform }}" "${GHCR_IMAGE_NAME}:${{ needs.publish.outputs.version }}"

      - name: Verify status, packaged version, and conventional compile
        env:
          TYPR_COMPANION_DOCKER_IMAGE: ${{ env.GHCR_IMAGE_NAME }}:${{ needs.publish.outputs.version }}
          TYPR_COMPANION_DOCKER_SKIP_BUILD: "1"
          TYPR_COMPANION_EXPECTED_VERSION: ${{ needs.publish.outputs.version }}
        run: npm run test:companion:docker
