services:
  typr-server:
    build:
      context: .
      dockerfile: docker/typr-server.Dockerfile
      target: runtime
    image: typr-server:dev
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=536870912
    pids_limit: 256
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2.0
    stop_grace_period: 15s
    ports:
      - "${TYPR_COMPANION_BIND_ADDRESS:-127.0.0.1}:${TYPR_COMPANION_PORT:-8484}:8484"
