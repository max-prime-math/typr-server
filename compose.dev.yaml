services:
  typr-server:
    build:
      context: .
      dockerfile: docker/typr-server.Dockerfile
      target: runtime
    image: typr-server:dev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=536870912
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    ports:
      - "127.0.0.1:8484:8484"
