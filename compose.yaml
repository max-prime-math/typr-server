services:
  typr-server:
    image: ${TYPR_COMPANION_IMAGE:-ghcr.io/max-prime-math/typr-server:latest}
    restart: unless-stopped
    user: "1000:1000"
    environment:
      TYPR_COMPANION_ALLOWED_ORIGINS: ${TYPR_COMPANION_ALLOWED_ORIGINS:-}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=536870912
    pids_limit: 256
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2.0
    stop_grace_period: 15s
    ports:
      # Keep the trusted-local Companion private to this machine.
      - "${TYPR_COMPANION_BIND_ADDRESS:-127.0.0.1}:${TYPR_COMPANION_PORT:-8484}:8484"
